<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dog Shop" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="manifest" href="/manifest.json" />
  <title>Dog Shop</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c27;
      --border: #2a2a3a;
      --accent: #7c6af7;
      --accent-glow: rgba(124, 106, 247, 0.25);
      --accent2: #f7a06a;
      --text: #f0f0f8;
      --text-dim: #8888aa;
      --checked: #3a3a50;
      --checked-text: #5a5a78;
      --danger: #f76a6a;
      --walmart: #0071ce;
      --walmart-hover: #0058a3;
      --success: #6af7a0;
      --radius: 16px;
      --radius-sm: 10px;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-top: var(--safe-top);
      background: radial-gradient(ellipse 100% 45% at 50% -5%, rgba(124,106,247,0.18) 0%, transparent 65%);
    }

    /* Header */
    header {
      padding: 20px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: 0 0 18px rgba(124,106,247,0.55);
    }

    .logo-text {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text) 60%, var(--text-dim));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .item-count {
      font-size: 13px;
      color: var(--text-dim);
      background: var(--surface2);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    /* Add input */
    .add-section {
      padding: 16px 20px;
      flex-shrink: 0;
    }

    .add-form {
      display: flex;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 6px 6px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .add-form:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #item-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 16px;
      min-height: 44px;
      caret-color: var(--accent);
    }

    #item-input::placeholder {
      color: var(--text-dim);
    }

    .add-btn {
      background: linear-gradient(135deg, var(--accent), #9a8af9);
      border: none;
      color: white;
      font-size: 22px;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .add-btn:active { transform: scale(0.92); opacity: 0.85; }
    .add-form:focus-within .add-btn { box-shadow: 0 0 14px rgba(124,106,247,0.65); }
    .check-btn:active { transform: scale(0.75); }

    /* Tabs */
    .tabs {
      display: flex;
      padding: 0 20px;
      gap: 6px;
      flex-shrink: 0;
      margin-bottom: 4px;
    }

    .tab {
      flex: 1;
      padding: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--accent), #9a8af9);
      border-color: var(--accent);
      color: white;
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    /* List */
    .list-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 8px 20px;
      -webkit-overflow-scrolling: touch;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Item card */
    .item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px 14px 16px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: slideIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .item:not(.checked) {
      box-shadow: inset 3px 0 0 var(--accent), 0 2px 12px rgba(0,0,0,0.25);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .item.checked {
      background: var(--checked);
      border-color: transparent;
    }

    .item.removing {
      animation: slideOut 0.25s ease forwards;
    }

    @keyframes slideOut {
      to { opacity: 0; transform: translateX(20px) scale(0.95); max-height: 0; margin: 0; padding: 0; }
    }

    .check-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: none;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .item.checked .check-btn {
      background: var(--success);
      border-color: var(--success);
      color: #0a0a0f;
      font-size: 13px;
      box-shadow: 0 0 10px rgba(106,247,160,0.5);
    }

    .item-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .item-name {
      font-size: 17px;
      font-weight: 500;
      line-height: 1.3;
      transition: color 0.2s;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-badge {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid rgba(124,106,247,0.3);
      border-radius: 6px;
      padding: 1px 7px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .qty-placeholder {
      font-size: 11px;
      color: var(--text-dim);
      opacity: 0.3;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .qty-input {
      width: 52px;
      background: none;
      border: none;
      border-bottom: 1px solid var(--accent);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      outline: none;
      padding: 1px 2px;
      text-align: center;
      flex-shrink: 0;
    }

    .item.checked .qty-badge,
    .item.checked .qty-placeholder { opacity: 0.4; pointer-events: none; }

    .item-by {
      font-size: 11px;
      color: var(--text-dim);
      opacity: 0.5;
      line-height: 1;
      padding-left: 1px;
    }

    .item.checked .item-by { display: none; }

    .item-note {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.4;
      cursor: text;
      word-break: break-word;
    }

    .note-placeholder {
      font-size: 12px;
      color: var(--text-dim);
      opacity: 0.35;
      cursor: text;
    }

    .note-input {
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid var(--accent);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      padding: 2px 0 4px;
    }

    .item.checked .item-name {
      color: var(--checked-text);
      text-decoration: line-through;
      text-decoration-color: var(--checked-text);
    }

    .item.checked .item-note,
    .item.checked .note-placeholder { display: none; }

    .item { align-items: flex-start; }
    .check-btn { margin-top: 10px; flex-shrink: 0; }
    .item-actions { margin-top: 8px; }

    .comment-trigger {
      margin-top: 4px;
      cursor: pointer;
    }

    .comment-indicator {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
    }

    .comment-placeholder-small {
      font-size: 12px;
      color: var(--text-dim);
      opacity: 0.3;
    }

    .thread {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .thread.open { display: flex; }

    .comment {
      background: var(--surface2);
      border-radius: 10px;
      padding: 8px 12px;
    }

    .comment-author {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 3px;
    }

    .comment-text {
      font-size: 14px;
      color: var(--text);
      line-height: 1.4;
      word-break: break-word;
    }

    .comment-time {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .comment-empty, .comments-loading {
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
      padding: 4px 0;
    }

    .comment-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .comment-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      padding: 8px 14px;
      caret-color: var(--accent);
      min-height: 36px;
    }

    .comment-input:focus { border-color: var(--accent); }

    .comment-send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #9a8af9);
      border: none;
      color: white;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
      box-shadow: 0 2px 8px var(--accent-glow);
      -webkit-tap-highlight-color: transparent;
    }

    .comment-send-btn:active { opacity: 0.85; transform: scale(0.9); }

    .item-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-btn:active { opacity: 0.65; transform: scale(0.9); }
    .icon-btn.walmart { color: var(--walmart); border-color: rgba(0,113,206,0.3); }
    .icon-btn.delete { color: var(--danger); border-color: rgba(247,106,106,0.3); }

    /* Shopping button active state */
    .icon-btn.shopping-active {
      color: var(--accent2);
      border-color: rgba(247,160,106,0.5);
      background: rgba(247,160,106,0.1);
    }

    /* Empty state */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 12px;
      color: var(--text-dim);
    }

    .empty-icon { font-size: 48px; }
    .empty-title { font-size: 18px; font-weight: 600; color: var(--text); }
    .empty-sub { font-size: 14px; text-align: center; line-height: 1.5; }

    /* Session banner */
    .session-banner {
      margin: 10px 20px 0;
      background: rgba(247, 160, 106, 0.1);
      border: 1px solid rgba(247, 160, 106, 0.3);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .session-banner.hidden { display: none; }

    .session-text {
      font-size: 14px;
      color: var(--accent2);
      font-weight: 600;
    }

    .session-done-btn {
      background: none;
      border: 1px solid rgba(247,160,106,0.5);
      border-radius: 20px;
      color: var(--accent2);
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .session-done-btn:active { opacity: 0.7; }
    .session-done-btn.hidden { display: none; }

    /* Shop all button */
    .footer {
      padding: 12px 20px;
      padding-bottom: calc(12px + var(--safe-bottom));
      flex-shrink: 0;
      display: flex;
      gap: 10px;
    }

    .shop-btn {
      flex: 1;
      background: linear-gradient(135deg, var(--walmart), #0d8ce8);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.2px;
      box-shadow: 0 4px 20px rgba(0,113,206,0.45);
    }

    .shop-btn:active { opacity: 0.85; transform: scale(0.98); }
    .shop-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .clear-btn {
      background: var(--surface);
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .clear-btn:active { opacity: 0.65; }

    /* What's New changelog */
    .changelog-block { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    .changelog-date {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
    }
    .changelog-item {
      display: flex;
      gap: 8px;
      font-size: 14px;
      color: var(--text);
      line-height: 1.4;
    }
    .changelog-item::before {
      content: "•";
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: calc(90px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s;
      white-space: nowrap;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Sync dot */
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      transition: background 0.3s;
    }
    .sync-dot.syncing { background: var(--accent2); animation: pulse 1s infinite; }
    .sync-dot.error { background: var(--danger); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Divider */
    .checked-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0 4px;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .checked-divider::before, .checked-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* History tab */
    .history-day-header {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      padding: 14px 0 6px;
    }

    .history-day-header:first-child { padding-top: 4px; }

    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
    }

    .history-item-check {
      font-size: 13px;
      color: var(--success);
      flex-shrink: 0;
    }

    .history-item-name {
      font-size: 15px;
      color: var(--checked-text);
      text-decoration: line-through;
      text-decoration-color: var(--checked-text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .suggestions-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .suggestions-header::before, .suggestions-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(124,106,247,0.25);
    }

    .history-suggestion {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid rgba(124,106,247,0.2);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
    }

    .suggestion-name {
      flex: 1;
      font-size: 15px;
      color: var(--text);
      font-weight: 500;
    }

    .suggestion-count {
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .suggestion-add-btn {
      background: var(--accent-glow);
      border: 1px solid rgba(124,106,247,0.4);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      border-radius: 20px;
      padding: 5px 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }

    .suggestion-add-btn:active { opacity: 0.7; transform: scale(0.95); }
    .suggestion-add-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .suggestion-on-list {
      font-size: 12px;
      color: var(--success);
      font-weight: 600;
      white-space: nowrap;
    }

    /* ── Modals ─────────────────────────────────────────────────────────── */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 20px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .modal-overlay.hidden { display: none; }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      animation: modalIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.92) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-icon { font-size: 38px; }
    .modal-title { font-size: 20px; font-weight: 700; color: var(--text); text-align: center; }
    .modal-sub { font-size: 14px; color: var(--text-dim); text-align: center; line-height: 1.5; }

    .modal-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 17px;
      font-family: inherit;
      padding: 12px 14px;
      outline: none;
      caret-color: var(--accent);
      text-align: center;
    }

    .modal-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .modal-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #9a8af9);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-size: 16px;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .modal-btn:active { opacity: 0.85; transform: scale(0.98); }

    .modal-cancel {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 15px;
      cursor: pointer;
      padding: 4px 8px;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    /* Store picker grid */
    .store-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .store-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 22px;
      font-weight: 600;
      padding: 18px 10px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .store-btn span { font-size: 13px; color: var(--text-dim); font-weight: 600; }
    .store-btn:active { border-color: var(--accent); background: var(--accent-glow); transform: scale(0.96); }
  </style>
</head>
<body>

  <!-- Name setup modal — shown on first launch -->
  <div class="modal-overlay hidden" id="name-modal">
    <div class="modal-card">
      <div class="modal-icon">👋</div>
      <div class="modal-title">What's your name?</div>
      <div class="modal-sub">So everyone knows who's adding things to the list.</div>
      <input
        class="modal-input"
        id="name-input"
        type="text"
        placeholder="Beth, Greg, Ben…"
        maxlength="20"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="done"
      />
      <button class="modal-btn" id="name-save-btn">Let's shop</button>
    </div>
  </div>

  <!-- Store picker modal -->
  <div class="modal-overlay hidden" id="store-modal">
    <div class="modal-card">
      <div class="modal-title">Where are you shopping?</div>
      <div class="store-grid">
        <button class="store-btn" data-store="walmart">🛒<span>Walmart</span></button>
        <button class="store-btn" data-store="foodlion">🦁<span>Food Lion</span></button>
        <button class="store-btn" data-store="publix">🌿<span>Publix</span></button>
        <button class="store-btn" data-store="other">🏪<span>Other</span></button>
      </div>
      <button class="modal-cancel" id="store-cancel">Cancel</button>
    </div>
  </div>

  <header>
    <div class="logo">
      <div class="logo-icon">🛒</div>
      <span class="logo-text">Dog Shop</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="icon-btn" id="shopping-btn" title="I'm going shopping" aria-label="Start shopping">🏃</button>
      <button class="icon-btn" id="notif-btn" aria-label="Enable notifications">🔔</button>
      <div class="sync-dot" id="sync-dot"></div>
      <span class="item-count" id="item-count">0 items</span>
    </div>
  </header>

  <!-- Active shopping session banner -->
  <div class="session-banner hidden" id="session-banner">
    <span class="session-text" id="session-text"></span>
    <button class="session-done-btn hidden" id="session-done-btn">Done</button>
  </div>

  <div class="add-section">
    <div class="add-form">
      <input
        type="text"
        id="item-input"
        placeholder="Add an item…"
        autocomplete="off"
        autocorrect="off"
        spellcheck="true"
        enterkeyhint="done"
      />
      <button class="add-btn" id="add-btn" aria-label="Add item">+</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="all">All</button>
    <button class="tab" data-tab="active">Need</button>
    <button class="tab" data-tab="checked">Got</button>
    <button class="tab" data-tab="history">History</button>
  </div>

  <div class="list-wrapper">
    <div class="list" id="list"></div>
  </div>

  <div class="footer">
    <button class="shop-btn" id="shop-btn" disabled>
      🛒 Shop All on Walmart
    </button>
    <button class="clear-btn" id="clear-btn">Clear Got</button>
  </div>

  <div class="toast" id="toast"></div>

  <!-- What's New modal -->
  <div class="modal-overlay hidden" id="whats-new-modal">
    <div class="modal-card" style="gap:12px;">
      <div class="modal-icon">✨</div>
      <div class="modal-title">What's New</div>
      <div id="whats-new-list" style="width:100%;display:flex;flex-direction:column;gap:16px;"></div>
      <button class="modal-btn" id="whats-new-ack">Got it!</button>
    </div>
  </div>

  <script>
    const API = "https://dog-shop-api.gdoggett.workers.dev";
    const VAPID_PUBLIC_KEY = "BApWWtkmLw-40xvXEpRZGdFR9De6O3I-CGyofmH6NqR46tjAPLURv9suS9xhE-ZEBXf-dWSr-IVEgu-ZfALadQw";

    // Store definitions
    const STORES = {
      walmart:  { name: "Walmart",   searchUrl: q => `https://www.walmart.com/search?q=${encodeURIComponent(q)}` },
      foodlion: { name: "Food Lion", searchUrl: q => `https://www.foodlion.com/search?q=${encodeURIComponent(q)}` },
      publix:   { name: "Publix",    searchUrl: q => `https://www.publix.com/search?q=${encodeURIComponent(q)}` },
      other:    { name: "Store",     searchUrl: q => `https://www.google.com/search?q=${encodeURIComponent(q + " grocery")}` },
    };

    let items = [];
    let activeTab = "all";
    let pollTimer = null;
    let sessionPollTimer = null;
    let userName = localStorage.getItem("userName") || null;
    let currentSession = null;

    // Elements
    const listEl = document.getElementById("list");
    const inputEl = document.getElementById("item-input");
    const addBtn = document.getElementById("add-btn");
    const shopBtn = document.getElementById("shop-btn");
    const clearBtn = document.getElementById("clear-btn");
    const countEl = document.getElementById("item-count");
    const syncDot = document.getElementById("sync-dot");
    const toastEl = document.getElementById("toast");
    const shoppingBtn = document.getElementById("shopping-btn");
    const sessionBanner = document.getElementById("session-banner");
    const sessionText = document.getElementById("session-text");
    const sessionDoneBtn = document.getElementById("session-done-btn");

    // Store helpers
    function activeStore() { return currentSession?.store || "walmart"; }
    function activeStoreName() { return STORES[activeStore()]?.name || "Walmart"; }
    function itemSearchUrl(name) { return STORES[activeStore()].searchUrl(name); }

    // Toast
    let toastTimer;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2500);
    }

    // Sync state
    function setSyncing() { syncDot.className = "sync-dot syncing"; }
    function setSynced() { syncDot.className = "sync-dot"; }
    function setSyncError() { syncDot.className = "sync-dot error"; }

    // Fetch items
    async function loadItems(silent = false) {
      if (silent && (document.querySelector(".note-input") || document.querySelector(".thread.open"))) return;
      if (!silent) setSyncing();
      try {
        const res = await fetch(`${API}/api/items`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        items = data;
        render();
        setSynced();
      } catch {
        setSyncError();
      }
    }

    // Render list
    function render() {
      if (activeTab === "history") return;
      const unchecked = items.filter(i => !i.checked);
      const checked   = items.filter(i => i.checked);

      let visible = [];
      if (activeTab === "all")     visible = [...unchecked, ...checked];
      if (activeTab === "active")  visible = unchecked;
      if (activeTab === "checked") visible = checked;

      // Update count
      const total = unchecked.length;
      countEl.textContent = total === 0 ? "all clear" : `${total} need${total === 1 ? "s" : ""}`;

      // Shop button
      shopBtn.disabled = unchecked.length === 0;
      shopBtn.textContent = `🛒 Shop All on ${activeStoreName()}`;

      // Render
      listEl.innerHTML = "";

      if (visible.length === 0) {
        const msg = activeTab === "checked"
          ? ["✓", "Nothing checked off yet", "Tap the circle on an item when it's in the cart."]
          : ["🛒", "List is empty", "Add your first item above and everyone will see it."];
        listEl.innerHTML = `
          <div class="empty">
            <div class="empty-icon">${msg[0]}</div>
            <div class="empty-title">${msg[1]}</div>
            <div class="empty-sub">${msg[2]}</div>
          </div>`;
        return;
      }

      if (activeTab === "all" && unchecked.length > 0 && checked.length > 0) {
        visible = unchecked;
        visible.forEach(item => listEl.appendChild(makeCard(item)));
        const div = document.createElement("div");
        div.className = "checked-divider";
        div.textContent = "In the cart";
        listEl.appendChild(div);
        checked.forEach(item => listEl.appendChild(makeCard(item)));
      } else {
        visible.forEach(item => listEl.appendChild(makeCard(item)));
      }
    }

    function makeCard(item) {
      const el = document.createElement("div");
      el.className = `item${item.checked ? " checked" : ""}`;
      el.dataset.id = item.id;

      const searchUrl = itemSearchUrl(item.name);
      const noteHtml = item.note
        ? `<span class="item-note">${escHtml(item.note)}</span>`
        : `<span class="note-placeholder">+ note</span>`;
      const qtyHtml = item.qty
        ? `<span class="qty-badge">${escHtml(item.qty)}</span>`
        : `<span class="qty-placeholder">qty</span>`;

      const count = item.comment_count || 0;
      const commentTriggerHtml = count > 0
        ? `<span class="comment-indicator">💬 ${count}</span>`
        : `<span class="comment-placeholder-small">💬</span>`;

      const addedByHtml = item.added_by
        ? `<div class="item-by">• ${escHtml(item.added_by)}</div>`
        : "";

      el.innerHTML = `
        <button class="check-btn" aria-label="Toggle checked">
          ${item.checked ? "✓" : ""}
        </button>
        <div class="item-body">
          <div class="name-row">
            <div class="qty-area">${qtyHtml}</div>
            <span class="item-name">${escHtml(item.name)}</span>
          </div>
          ${addedByHtml}
          <div class="note-area">${noteHtml}</div>
          <div class="comment-trigger">${commentTriggerHtml}</div>
          <div class="thread"></div>
        </div>
        <div class="item-actions">
          <a class="icon-btn walmart" href="${searchUrl}" aria-label="Find on ${activeStoreName()}">🛒</a>
          <button class="icon-btn delete" aria-label="Delete item">✕</button>
        </div>`;

      el.querySelector(".check-btn").addEventListener("click", () => toggleCheck(item.id));
      el.querySelector(".delete").addEventListener("click", () => deleteItem(item.id, el));
      el.querySelector(".note-area").addEventListener("click", () => openNoteInput(item, el));
      el.querySelector(".qty-area").addEventListener("click", () => openQtyInput(item, el));
      el.querySelector(".comment-trigger").addEventListener("click", () => openThread(item, el));
      return el;
    }

    function timeAgo(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return `${mins}m ago`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }

    async function openThread(item, el) {
      const thread = el.querySelector(".thread");
      if (thread.classList.contains("open")) {
        thread.classList.remove("open");
        thread.innerHTML = "";
        return;
      }
      thread.classList.add("open");
      thread.innerHTML = `<div class="comments-loading">Loading…</div>`;
      try {
        const res = await fetch(`${API}/api/items/${item.id}/comments`);
        const comments = await res.json();
        renderThread(item, el, comments);
      } catch {
        thread.innerHTML = `<div class="comments-loading">Couldn't load</div>`;
      }
    }

    function renderThread(item, el, comments) {
      const thread = el.querySelector(".thread");
      const commentsHtml = comments.length
        ? comments.map(c => `
            <div class="comment">
              ${c.author ? `<div class="comment-author">${escHtml(c.author)}</div>` : ""}
              <div class="comment-text">${escHtml(c.text)}</div>
              <div class="comment-time">${timeAgo(c.created_at)}</div>
            </div>`).join("")
        : `<div class="comment-empty">No comments yet — ask a question</div>`;

      thread.innerHTML = `
        <div class="comments-list">${commentsHtml}</div>
        <div class="comment-input-row">
          <input class="comment-input" type="text" placeholder="Ask a question…" enterkeyhint="send" />
          <button class="comment-send-btn">↑</button>
        </div>`;

      const input = thread.querySelector(".comment-input");
      const sendBtn = thread.querySelector(".comment-send-btn");

      const send = async () => {
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        const senderEndpoint = localStorage.getItem("pushEndpoint") || null;
        try {
          const res = await fetch(`${API}/api/items/${item.id}/comments`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, senderEndpoint, author: userName }),
          });
          const comment = await res.json();
          const list = thread.querySelector(".comments-list");
          const empty = list.querySelector(".comment-empty");
          if (empty) empty.remove();
          const div = document.createElement("div");
          div.className = "comment";
          div.innerHTML = `
            ${userName ? `<div class="comment-author">${escHtml(userName)}</div>` : ""}
            <div class="comment-text">${escHtml(comment.text)}</div>
            <div class="comment-time">just now</div>`;
          list.appendChild(div);
          item.comment_count = (item.comment_count || 0) + 1;
          const trigger = el.querySelector(".comment-trigger");
          trigger.innerHTML = `<span class="comment-indicator">💬 ${item.comment_count}</span>`;
          if ("vibrate" in navigator) navigator.vibrate(15);
        } catch {
          showToast("Couldn't send");
          input.value = text;
        }
      };

      sendBtn.addEventListener("click", send);
      input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); send(); } });
      input.focus();
    }

    function openQtyInput(item, el) {
      const area = el.querySelector(".qty-area");
      if (area.querySelector(".qty-input")) return;

      const input = document.createElement("input");
      input.type = "text";
      input.className = "qty-input";
      input.placeholder = "qty";
      input.value = item.qty || "";
      input.setAttribute("enterkeyhint", "done");
      area.innerHTML = "";
      area.appendChild(input);
      input.focus();
      input.select();

      const save = async () => {
        const qty = input.value.trim();
        item.qty = qty || null;
        area.innerHTML = qty
          ? `<span class="qty-badge">${escHtml(qty)}</span>`
          : `<span class="qty-placeholder">qty</span>`;
        try {
          await fetch(`${API}/api/items/${item.id}/qty`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ qty: qty || null }),
          });
        } catch { /* best effort */ }
      };

      input.addEventListener("blur", save);
      input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); input.blur(); } });
    }

    function openNoteInput(item, el) {
      const area = el.querySelector(".note-area");
      if (area.querySelector(".note-input")) return;

      const input = document.createElement("input");
      input.type = "text";
      input.className = "note-input";
      input.placeholder = "Add a note…";
      input.value = item.note || "";
      input.setAttribute("enterkeyhint", "done");
      area.innerHTML = "";
      area.appendChild(input);
      input.focus();

      const save = async () => {
        const note = input.value.trim();
        item.note = note || null;
        area.innerHTML = note
          ? `<span class="item-note">${escHtml(note)}</span>`
          : `<span class="note-placeholder">+ note</span>`;
        try {
          await fetch(`${API}/api/items/${item.id}/note`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ note: note || null }),
          });
        } catch { /* best effort */ }
      };

      input.addEventListener("blur", save);
      input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); input.blur(); } });
    }

    function escHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    // Add item
    async function addItem() {
      const name = inputEl.value.trim();
      if (!name) return;
      inputEl.value = "";
      setSyncing();
      try {
        const senderEndpoint = localStorage.getItem("pushEndpoint") || null;
        const res = await fetch(`${API}/api/items`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, senderEndpoint, added_by: userName }),
        });
        if (!res.ok) throw new Error();
        const item = await res.json();
        items.unshift(item);
        items = [...items.filter(i => !i.checked), ...items.filter(i => i.checked)];
        render();
        setSynced();
        showToast(`"${name}" added`);
        if ("vibrate" in navigator) navigator.vibrate(15);
      } catch {
        setSyncError();
        showToast("Couldn't add item — check connection");
        inputEl.value = name;
      }
    }

    // Toggle check
    async function toggleCheck(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.checked = !item.checked;
      if ("vibrate" in navigator) navigator.vibrate(25);
      render();
      setSyncing();
      try {
        await fetch(`${API}/api/items/${id}/check`, { method: "PATCH" });
        setSynced();
      } catch {
        item.checked = !item.checked;
        render();
        setSyncError();
      }
    }

    // Delete item
    async function deleteItem(id, el) {
      el.classList.add("removing");
      setTimeout(async () => {
        items = items.filter(i => i.id !== id);
        render();
        setSyncing();
        try {
          await fetch(`${API}/api/items/${id}`, { method: "DELETE" });
          setSynced();
        } catch {
          setSyncError();
        }
      }, 250);
    }

    // Clear all checked
    async function clearChecked() {
      const checked = items.filter(i => i.checked);
      if (checked.length === 0) { showToast("Nothing checked off yet"); return; }
      items = items.filter(i => !i.checked);
      render();
      setSyncing();
      try {
        await Promise.all(checked.map(i =>
          fetch(`${API}/api/items/${i.id}`, { method: "DELETE" })
        ));
        setSynced();
        showToast(`Cleared ${checked.length} item${checked.length === 1 ? "" : "s"}`);
      } catch {
        setSyncError();
      }
    }

    // Shop all — store-aware, same tab so back button returns to app
    function shopAll() {
      const unchecked = items.filter(i => !i.checked);
      if (unchecked.length === 0) return;
      const query = unchecked.map(i => i.name).join(" ");
      window.location.href = STORES[activeStore()].searchUrl(query);
    }

    // ─── History ─────────────────────────────────────────────────────────────

    let historyData = null;

    async function loadHistory() {
      listEl.innerHTML = `<div class="empty"><div class="empty-icon">⏳</div><div class="empty-title">Loading history…</div></div>`;
      try {
        const res = await fetch(`${API}/api/history`);
        historyData = await res.json();
        renderHistory();
      } catch {
        listEl.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Couldn't load history</div></div>`;
      }
    }

    function formatDay(dateStr) {
      const date = new Date(dateStr + "T00:00:00");
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const diff = Math.round((today - date) / 86400000);
      if (diff === 0) return "Today";
      if (diff === 1) return "Yesterday";
      return date.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
    }

    function renderHistory() {
      listEl.innerHTML = "";
      const { removed = [], recommendations = [] } = historyData || {};

      const byDay = {};
      removed.forEach(r => {
        const day = r.removed_at.slice(0, 10);
        if (!byDay[day]) byDay[day] = [];
        byDay[day].push(r);
      });
      const days = Object.keys(byDay).sort().reverse();

      if (days.length === 0 && recommendations.length === 0) {
        listEl.innerHTML = `
          <div class="empty">
            <div class="empty-icon">📋</div>
            <div class="empty-title">No history yet</div>
            <div class="empty-sub">Items you check off and clear will appear here. Suggestions show up once patterns emerge.</div>
          </div>`;
        return;
      }

      days.forEach(day => {
        const header = document.createElement("div");
        header.className = "history-day-header";
        header.textContent = formatDay(day);
        listEl.appendChild(header);

        byDay[day].forEach(r => {
          const el = document.createElement("div");
          el.className = "history-item";
          const qtyHtml = r.qty ? ` <span class="qty-badge">${escHtml(r.qty)}</span>` : "";
          el.innerHTML = `
            <span class="history-item-check">✓</span>
            <span class="history-item-name">${escHtml(r.name)}${qtyHtml}</span>`;
          listEl.appendChild(el);
        });
      });

      if (recommendations.length > 0) {
        const hdr = document.createElement("div");
        hdr.className = "suggestions-header";
        hdr.innerHTML = `<span>Suggested — bought regularly</span>`;
        listEl.appendChild(hdr);

        recommendations.forEach(rec => {
          const alreadyOnList = items.some(
            i => i.name.toLowerCase().trim() === rec.name.toLowerCase().trim()
          );
          const el = document.createElement("div");
          el.className = "history-suggestion";
          el.innerHTML = `
            <span class="suggestion-name">${escHtml(rec.name)}</span>
            <span class="suggestion-count">${rec.removals}× in 90 days</span>
            ${alreadyOnList
              ? `<span class="suggestion-on-list">On list</span>`
              : `<button class="suggestion-add-btn">+ Add</button>`}`;
          if (!alreadyOnList) {
            el.querySelector(".suggestion-add-btn").addEventListener("click", () =>
              addFromSuggestion(rec.name, el)
            );
          }
          listEl.appendChild(el);
        });
      }
    }

    async function addFromSuggestion(name, el) {
      const btn = el.querySelector(".suggestion-add-btn");
      btn.disabled = true;
      btn.textContent = "Adding…";
      const senderEndpoint = localStorage.getItem("pushEndpoint") || null;
      try {
        const res = await fetch(`${API}/api/items`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, senderEndpoint, added_by: userName }),
        });
        if (!res.ok) throw new Error();
        const item = await res.json();
        items.push(item);
        btn.textContent = "✓ Added";
        btn.style.background = "rgba(106,247,160,0.15)";
        btn.style.borderColor = "rgba(106,247,160,0.4)";
        btn.style.color = "var(--success)";
        showToast(`"${name}" added to list`);
        if ("vibrate" in navigator) navigator.vibrate(15);
      } catch {
        btn.disabled = false;
        btn.textContent = "+ Add";
        showToast("Couldn't add — check connection");
      }
    }

    // Tabs
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeTab = tab.dataset.tab;
        const footer = document.querySelector(".footer");
        if (activeTab === "history") {
          footer.style.display = "none";
          loadHistory();
        } else {
          footer.style.display = "";
          render();
        }
      });
    });

    // Events
    addBtn.addEventListener("click", addItem);
    inputEl.addEventListener("keydown", e => { if (e.key === "Enter") addItem(); });
    shopBtn.addEventListener("click", shopAll);
    clearBtn.addEventListener("click", clearChecked);

    // Live polling — refresh every 5 seconds
    function startPolling() {
      pollTimer = setInterval(() => loadItems(true), 5000);
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        clearInterval(pollTimer);
        clearInterval(sessionPollTimer);
      } else {
        loadItems(true);
        loadSession();
        startPolling();
        sessionPollTimer = setInterval(loadSession, 10000);
      }
    });

    // ─── What's New modal ─────────────────────────────────────────────────────
    const CHANGELOG = [
      {
        version: "2026-05-21-history",
        date: "May 21",
        changes: [
          "History tab — see everything you've bought, grouped by day",
          "Suggestions — items you buy regularly bubble up automatically",
          "Comment threads — ask questions on any item, get push notifications",
        ],
      },
      {
        version: "2026-05-31-user-session",
        date: "May 31",
        changes: [
          "Your name — set it once, shows on everything you add",
          "See who added each item at a glance",
          "Comment threads show who said what",
          "\"I'm shopping\" mode — tell the family where you are",
          "Store-aware search — links go to Walmart, Food Lion, or Publix",
        ],
      },
    ];

    const LATEST_VERSION = CHANGELOG[CHANGELOG.length - 1].version;

    function checkWhatsNew() {
      const lastSeen = localStorage.getItem("whatsNewSeen") || "";
      const lastIdx = CHANGELOG.findIndex(c => c.version === lastSeen);
      // Show all entries newer than last acknowledged (or all if never seen)
      const unseen = lastIdx === -1 ? CHANGELOG : CHANGELOG.slice(lastIdx + 1);
      if (unseen.length === 0) return;

      const listEl = document.getElementById("whats-new-list");
      listEl.innerHTML = unseen.map(entry => `
        <div class="changelog-block">
          <div class="changelog-date">${entry.date}</div>
          ${entry.changes.map(c => `
            <div class="changelog-item"><span>${c}</span></div>
          `).join("")}
        </div>
      `).join("");

      document.getElementById("whats-new-modal").classList.remove("hidden");
    }

    document.getElementById("whats-new-ack").addEventListener("click", () => {
      document.getElementById("whats-new-modal").classList.add("hidden");
      localStorage.setItem("whatsNewSeen", LATEST_VERSION);
    });

    // ─── User name ───────────────────────────────────────────────────────────

    // Wire up name modal once
    (function setupNameModal() {
      const modal = document.getElementById("name-modal");
      const input = document.getElementById("name-input");
      const btn = document.getElementById("name-save-btn");

      const save = () => {
        const name = input.value.trim();
        if (!name) { input.focus(); return; }
        userName = name;
        localStorage.setItem("userName", name);
        modal.classList.add("hidden");
      };

      btn.addEventListener("click", save);
      input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); save(); } });
    })();

    function checkName() {
      if (!userName) {
        document.getElementById("name-modal").classList.remove("hidden");
        setTimeout(() => document.getElementById("name-input").focus(), 350);
      }
    }

    // ─── Shopping session ────────────────────────────────────────────────────

    // Wire up store modal once
    (function setupStoreModal() {
      const modal = document.getElementById("store-modal");

      document.querySelectorAll(".store-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          modal.classList.add("hidden");
          startShopping(btn.dataset.store);
        });
      });

      document.getElementById("store-cancel").addEventListener("click", () => {
        modal.classList.add("hidden");
      });
    })();

    shoppingBtn.addEventListener("click", () => {
      if (!userName) { checkName(); return; }
      if (currentSession && currentSession.shopper === userName) {
        stopShopping();
      } else {
        document.getElementById("store-modal").classList.remove("hidden");
      }
    });

    sessionDoneBtn.addEventListener("click", stopShopping);

    async function startShopping(store) {
      try {
        const res = await fetch(`${API}/api/session`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ shopper: userName, store }),
        });
        if (!res.ok) throw new Error();
        currentSession = { shopper: userName, store, started_at: new Date().toISOString() };
        renderSessionBanner(currentSession);
        render();
        showToast(`Shopping at ${STORES[store].name}!`);
        if ("vibrate" in navigator) navigator.vibrate([20, 40, 20]);
      } catch {
        showToast("Couldn't start session");
      }
    }

    async function stopShopping() {
      try {
        await fetch(`${API}/api/session`, { method: "DELETE" });
        currentSession = null;
        renderSessionBanner(null);
        render();
        showToast("Shopping done!");
      } catch {
        showToast("Couldn't end session");
      }
    }

    async function loadSession() {
      try {
        const res = await fetch(`${API}/api/session`);
        const session = await res.json();
        currentSession = session;
        renderSessionBanner(session);
      } catch { /* best effort — don't break if this fails */ }
    }

    function renderSessionBanner(session) {
      if (!session) {
        sessionBanner.classList.add("hidden");
        shoppingBtn.classList.remove("shopping-active");
        shoppingBtn.title = "I'm going shopping";
        return;
      }

      const storeName = STORES[session.store]?.name || "the store";
      sessionText.textContent = `${session.shopper} is shopping at ${storeName} 🛒`;
      sessionBanner.classList.remove("hidden");

      const isMe = session.shopper === userName;
      if (isMe) {
        sessionDoneBtn.classList.remove("hidden");
        shoppingBtn.classList.add("shopping-active");
        shoppingBtn.title = "You're shopping — tap to finish";
      } else {
        sessionDoneBtn.classList.add("hidden");
        shoppingBtn.classList.remove("shopping-active");
        shoppingBtn.title = `${session.shopper} is shopping`;
      }
    }

    // ─── Notifications ───────────────────────────────────────────────────────
    const notifBtn = document.getElementById("notif-btn");

    function urlB64ToUint8Array(b64) {
      const pad = "=".repeat((4 - (b64.length % 4)) % 4);
      const raw = atob(b64.replace(/-/g, "+").replace(/_/g, "/") + pad);
      return Uint8Array.from(raw, c => c.charCodeAt(0));
    }

    async function subscribe() {
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY),
        });
        const { endpoint, keys: { p256dh, auth } } = sub.toJSON();
        await fetch(`${API}/api/subscribe`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ endpoint, p256dh, auth }),
        });
        localStorage.setItem("pushEndpoint", endpoint);
        notifBtn.textContent = "🔕";
        notifBtn.title = "Notifications on";
        showToast("Notifications on");
      } catch {
        showToast("Couldn't enable notifications");
      }
    }

    function initNotifButton() {
      const stored = localStorage.getItem("pushEndpoint");
      if (stored) {
        notifBtn.textContent = "🔕";
        notifBtn.title = "Notifications on";
      }
      notifBtn.addEventListener("click", async () => {
        if (!("Notification" in window) || !("PushManager" in window)) {
          showToast("Notifications not supported on this device");
          return;
        }
        const stored = localStorage.getItem("pushEndpoint");
        if (stored) { showToast("Notifications already on"); return; }
        const perm = await Notification.requestPermission();
        if (perm !== "granted") { showToast("Notifications blocked"); return; }
        await subscribe();
      });
    }

    // Service worker
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }

    // Init
    initNotifButton();
    loadItems();
    startPolling();
    checkWhatsNew();
    checkName();
    loadSession();
    sessionPollTimer = setInterval(loadSession, 10000);
  </script>
</body>
</html>
